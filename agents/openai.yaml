# Codex reads this file; Claude Code ignores it. It is the Codex twin of the
# SKILL.md frontmatter's `disable-model-invocation: true`: without it Codex
# invokes the skill implicitly on any "fix this", which the skill forbids.
interface:
  display_name: 'Spec-driven change'
  short_description: 'Gated requirements/design/tasks spec under docs/plans/ with approval receipts'
  default_prompt: 'Use $spec to turn this into a gated spec under docs/plans/.'

policy:
  allow_implicit_invocation: false
